name: Bug 报告
description: 报告可稳定复现的功能或界面问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿在此填写隐私数据或安全漏洞。
  - type: input
    id: version
    attributes:
      label: 念日版本
      placeholder: 例如 1.0.9
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机与 Android 版本
      placeholder: 例如 HUAWEI Mate 60 Pro / HarmonyOS 4.2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与截图
    validations:
      required: true
