plugins {
    id 'com.android.application'
}

def nianriVersionName = '1.1.2'
def nianriVersionCode = 28

if (!(nianriVersionName ==~ /[0-9]\.[0-9]\.[0-9]/)) {
    throw new GradleException('Version name must use one digit per segment, for example 1.1.0')
}

android {
    namespace 'com.nianri.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nianri.app'
        minSdk 26
        targetSdk 36
        versionCode nianriVersionCode
        versionName nianriVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "念日-v${variant.versionName}.apk"
    }
}

dependencies {
    implementation files('libs/lunar-1.7.7.jar')
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
}
